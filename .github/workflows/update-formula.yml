name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The payload reaches the shell only as environment variables, never as
      # text of the script.
      TAG: ${{ github.event.client_payload.tag }}
      VERSION: ${{ github.event.client_payload.version }}
      VISDOM_VERSION: ${{ github.event.client_payload.visdom_version }}
      SHA_AARCH64_DARWIN: ${{ github.event.client_payload.sha256_aarch64_apple_darwin }}
      SHA_X86_64_DARWIN: ${{ github.event.client_payload.sha256_x86_64_apple_darwin }}
      SHA_X86_64_LINUX: ${{ github.event.client_payload.sha256_x86_64_unknown_linux_gnu }}
      SHA_AARCH64_LINUX: ${{ github.event.client_payload.sha256_aarch64_unknown_linux_gnu }}
    steps:
      - uses: actions/checkout@v4

      - name: Update formulae
        run: scripts/update-formulae.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "Formulae already at ${VERSION}; nothing to commit."
            exit 0
          fi
          if [ -n "$VISDOM_VERSION" ]; then
            message="chore: update visdom to ${VISDOM_VERSION}, tracevault to ${VERSION}"
          else
            message="chore: update tracevault to ${VERSION}"
          fi
          git commit -m "$message"
          git push
